name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./changeFileName
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm install
    - run: npm run build
    - name: Upload ftp
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.HOST_IP }}
        username: ${{ secrets.USERNAME }}
        port: "21"
        password: ${{ secrets.PASSWORD }}
        local-dir: "changeFileName/dist/"
        server-dir: "htdocs/"