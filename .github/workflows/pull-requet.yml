name: Deploy to Hosting on push
on:
  push:
    branches:
      - master
jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_BASE }}
    defaults:
      run:
        working-directory: ./gallery/frontend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm install
    - run: npm run build
    - name: Upload ftp
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with: 
        server: ${{ secrets.HOST_IP }}
        username: ${{ secrets.USERNAME }}
        port: "21"
        password: ${{ secrets.PASSWORD }}
        local-dir: "gallery/frontend/dist/"
        server-dir: "htdocs/"
